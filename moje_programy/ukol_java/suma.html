<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma součet čísel od 1 do N</title>
</head>
<body>
    <script>


        let n = Number(prompt("Zadejte číslo N:"));
        let suma = 0;

        for (let i = 1; i <= n; i++) {
            suma += i;
        }

        document.write("Součet čísel od 1 do " + n + " je: " + suma);
    </script>
    
</body>
</html>
