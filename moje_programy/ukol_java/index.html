
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výpis podilu a zbytku</title>
</head>
<body>
   <script>
let a = prompt("Zadejte první číslo (dělenec):"); 
let b = prompt("Zadejte druhé číslo (dělitel):");

let podil = a / b;
let zbytek = a % b;

document.write("Podíl: " + podil + "<br>");
document.write("Zbytek: " + zbytek);


</script>
 
    
</body>
</html>
