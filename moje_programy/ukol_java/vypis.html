<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výpis čísla od 100 do 200</title>
</head>
<body>
    <script>

        for (let i = 100; i <= 200; i++) {
            document.write(i + "<br>");
        }
    </script>
</body>
</html>
