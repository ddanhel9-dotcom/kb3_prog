<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minimum a maximum</title>
</head>
<body>
   <script>
    
            let a = Number(prompt("Zadaj prvé číslo:"));
            let b = Number(prompt("Zadaj druhé číslo:"));
            let c = Number(prompt("Zadaj třetí číslo:"));
    
            let minimum = Math.min(a, b, c);
            let maximum = Math.max(a, b, c);
    
            document.write("Minimum: " + minimum + "<br>");
            document.write("Maximum: " + maximum);
   </script>
    
</body>
</html>
